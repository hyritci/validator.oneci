<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F39200">
<link rel="icon" href="img/logo-icone.png">
<title>Créer un compte · VALIDATOR</title>
<link rel="stylesheet" href="css/commun.css"></head>
<body><div class="auth">
<aside class="marque"><div class="marque-carte"><img src="img/logo-complet.png" alt="VALIDATOR"></div></aside>
<main class="formulaire">
  <img class="logo" src="img/logo-complet.png" alt="VALIDATOR">
  <h1>Créer un compte</h1>
  <p class="sous">Remplis ces informations. Ton compte sera activé par l'administrateur.</p>
  <label>Nom et prénoms</label>
  <div id="nom"></div>
  <label for="tel">Téléphone</label>
  <input id="tel" type="tel" inputmode="numeric" autocomplete="username" placeholder="07 00 00 00 00">
  <label for="mdp">Mot de passe (8 caractères minimum)</label>
  <div class="mdp"><input id="mdp" type="password" autocomplete="new-password"><button type="button" data-voir="mdp">Afficher</button></div>
  <label for="mdp2">Confirmer le mot de passe</label>
  <div class="mdp"><input id="mdp2" type="password" autocomplete="new-password"><button type="button" data-voir="mdp2">Afficher</button></div>
  <p class="msg" id="msg" role="alert"></p>
  <button class="btn" id="valider">Créer mon compte</button>
  <p class="bas">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
</main></div>
<script type="module">
import { LISTE } from "./data/chefs.js";   // liste des noms (chefs et sous-chefs pour l'instant)
import { inscription } from "./js/auth.js";
inscription(LISTE);
</script></body></html>
