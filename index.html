<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F39200">
<link rel="icon" href="img/logo-icone.png">
<title>Accueil · VALIDATOR</title>
<link rel="stylesheet" href="css/commun.css"><link rel="stylesheet" href="css/accueil.css"></head>
<body class="tdb">
<div class="app">
  <nav class="cote" aria-label="Navigation">
    <img src="img/logo-icone.png" alt="VALIDATOR">
    <a class="actif" href="index.html" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
    <button class="bas" id="quitter" aria-label="Se déconnecter" title="Se déconnecter"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </nav>
  <div class="contenu">
    <header class="barre">
      <div class="equipe"><select id="equipe" aria-label="Équipe"></select><small id="heures"></small></div>
      <p class="jour">Points du : <b id="date-jour"></b><span class="etat" id="etat">Connexion…</span></p>
      <button class="btn-excel" id="export">EXPORTER EN EXCEL</button>
    </header>
    <main>
      <section class="cartes" id="cartes" aria-label="Totaux par scénario"></section>
      <section class="outils">
        <input id="recherche" type="text" placeholder="Recherche par nom &amp; prénom" autocomplete="off" aria-label="Recherche par nom et prénom">
        <select id="filtre" aria-label="Filtrer par scénario"></select>
      </section>
      <section class="tableau" id="tableau">
        <div class="ligne th"><span>Nom &amp; Prénoms</span><span class="col-lieu">Lieu &amp; Heure</span><span>Scénario</span><span>Points</span></div>
        <div id="corps"></div>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script type="module" src="js/accueil.js"></script></body></html>
