<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F39200">
<link rel="icon" href="img/logo-icone.png">
<title>Absents · VALIDATOR</title>
<link rel="stylesheet" href="css/commun.css">
<link rel="stylesheet" href="css/accueil.css"></head>
<body class="tdb">
<div class="app">
  <nav class="cote" id="cote" aria-label="Navigation"></nav>
  <div class="contenu">
    <header class="barre">
      <div class="equipe"><select id="semaine" aria-label="Semaine d'absence"></select></div>
      <p class="jour">Absents du : <b id="periode">…</b><span class="etat" id="etat">Connexion…</span></p>
      <button class="btn-excel" id="export">EXPORTER EN EXCEL</button>
    </header>
    <main>
      <section class="outils">
        <label for="tri">Trier par</label>
        <select id="tri" aria-label="Trier par">
          <option value="date">Jour d'absence</option>
          <option value="chef">Chef / sous-chef</option>
          <option value="agent">Nom et prénom de l'agent</option>
          <option value="lieu">Lieu de service</option>
        </select>
      </section>
      <section class="tableau abs" id="tableau">
        <div class="ligne th"><span>Chef/sous-chef de l'agent</span><span>Lieu de service</span><span>Nom &amp; Prénoms agent</span><span>Jour d'absence</span><span>Justifier</span></div>
        <div id="corps"></div>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script type="module" src="js/menu-lateral.js"></script>
<script type="module">
// Si un fichier manque ou contient une erreur, un message rouge s'affiche en bas de l'écran
import("./js/absents.js").catch(e => {
  const d = document.createElement("div"); d.className = "toast ko";
  d.textContent = "Chargement impossible : " + (e.message || e); document.body.append(d); console.error(e);
});
</script></body></html>
